<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File List</title>
</head>
<body>
    <h1>Files</h1>
    <ul>
        {% if files %}
            {% for file in files %}
                <li>{{ file.title }} ({{ file.media_type }}): <a href="{{ file.file.url }}">{{ file.file.name }}</a></li>
            
            {% endfor %}
        {% else %}
        <p>No such files / images</p>
        {% endif %}
    </ul>    
    <a href="{% url "mainapp:upload_file" %}">Upload another file</a>
</body>
</html>
